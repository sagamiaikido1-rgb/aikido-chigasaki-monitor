name: 合気道 抽選分析(今の申込数と当選確率)

permissions:
  contents: write

on:
  # 2026-11 から自宅のWindowsパソコンで動かす。電源が切れているときは、次に電源を入れたときに動く(24時間以内)
  schedule:
    - cron: "11 11 * * *"   # UTC11:11 = 日本時間20:11(申込期間の1〜15日だけ動く。analyze.py が判定)。アクセスを減らすため1日1回
  workflow_dispatch:
    inputs:
      month:
        description: 対象月(例 2027-01)。空欄なら申込期間中の月
        default: ""

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: [self-hosted, Windows]   # 自宅のWindowsパソコンで動かす(予約サイトがGitHubからのアクセスを拒否するため 2026-11)
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\tools\ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/home-setup
      - name: 予約サイトに入れるか先に確認(入れなければ、ここで止める)
        run: |
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" -A "Mozilla/5.0" https://k7.p-kashikan.jp/chigasaki-city/ || echo 000)
          echo "予約サイトの応答: $code"
          if [ "$code" != "200" ]; then
            echo "::error::予約サイトに入れませんでした($code)。ログインせずに中止しました。"
            exit 1
          fi
      - name: 抽選の件数と全IDの申込を読む(申込・取消はしない)
        env:
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          ANALYZE_MONTH: ${{ github.event.inputs.month }}
        run: python analyze.py
      - name: 分析データ(ID番号と日付のみ)を保存
        if: success()
        run: |
          ls plan/analysis_latest.json >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add plan/analysis_latest.json plan/analysis/
          git commit -m "抽選分析のデータを保存" || exit 0
          git pull --rebase && git push
