name: 合気道 抽選分析(今の申込数と当選確率)

permissions:
  contents: write

on:
  # 【一時停止中 2026-11-11】予約サイトがGitHubからのアクセスを403で拒否しているため自動実行を止めています。
  # 再開するときは下の # を外してください。
#  schedule:
#    - cron: "11 22 * * *"   # UTC22:11 = 日本時間 7:11
#    - cron: "11 10 * * *"   # UTC10:11 = 日本時間19:11(申込期間の1〜15日だけ動く。analyze.py が判定)
  workflow_dispatch:
    inputs:
      month:
        description: 対象月(例 2027-01)。空欄なら申込期間中の月
        default: ""

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: 抽選の件数と全IDの申込を読む(申込・取消はしない)
        env:
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          ANALYZE_MONTH: ${{ github.event.inputs.month }}
        run: python analyze.py
      - name: 分析データ(ID番号と日付のみ)を保存
        if: success()
        run: |
          ls plan/analysis_latest.json >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add plan/analysis_latest.json plan/analysis/
          git commit -m "抽選分析のデータを保存" || exit 0
          git pull --rebase && git push
