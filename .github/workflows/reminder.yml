name: 合気道 毎月1日のお知らせ

on:
  schedule:
    - cron: 0 23 28-31 * *
  workflow_dispatch:
    inputs:
      force:
        description: 1=今日が1日でなくても送る(テスト)
        default: "1"
      month:
        description: 対象月(例 2026-11)。空欄なら来月
        default: ""

jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: お知らせ
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          FORCE: ${{ github.event.inputs.force }}
          MONTH: ${{ github.event.inputs.month }}
        run: python reminder.py
