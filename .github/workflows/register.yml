name: 合気道 抽選申込の登録(管理画面の確定を受けて)

on:
  schedule:
    - cron: "11,41 * 1-15,28-31 * *"   # 30分おきに管理画面の確定を確認(申込期間の前後のみ)
  workflow_dispatch:
    inputs:
      month:
        description: 対象月(例 2027-01)。空欄なら申込期間中の月
        default: ""
      reprocess:
        description: 1=処理済みの確定ももう一度処理する(代表の押し直し不要)
        default: "0"
      mode:
        description: dry=確認のみ / stop=テスト(「同意して申し込む」の手前で止める) / live=本番
        default: "dry"
      test_id:
        description: テスト用。このID番号だけ処理する(空欄なら全ID)
        default: ""
      test_limit:
        description: テスト用。追加する件数の上限(空欄なら制限なし)
        default: ""

concurrency:
  group: register
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: 管理画面で確定されたか確認
        id: check
        env:
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          REGISTER_MONTH: ${{ github.event.inputs.month }}
          REPROCESS: ${{ github.event.inputs.reprocess || '0' }}
        run: python register.py check
      - if: steps.check.outputs.run == '1'
        run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: 登録(代表の確定を受けて申込・取消)
        if: steps.check.outputs.run == '1'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          REGISTER_MONTH: ${{ steps.check.outputs.month }}
          REPROCESS: ${{ github.event.inputs.reprocess || '0' }}
          REGISTER_MODE: ${{ github.event.inputs.mode || 'live' }}   # 30分おきの自動実行は本番(代表の確定で申し込む)
          TEST_ID: ${{ github.event.inputs.test_id }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
        run: python register.py run
