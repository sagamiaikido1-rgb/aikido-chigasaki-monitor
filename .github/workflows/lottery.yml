name: 合気道 落選枠の空きチェック

on:
  # 【一時停止中 2026-11-11】予約サイトがGitHubからのアクセスを403で拒否しているため自動実行を止めています。
  # 再開するときは下の # を外してください。
#  schedule:
#    - cron: 15 0 * * *
#    - cron: 30 13 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: 1=テスト(メールを送らない) 0=本番
        default: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 予約サイトに入れるか先に確認(403なら、ここで止める)
        run: |
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" -A "Mozilla/5.0" https://k7.p-kashikan.jp/chigasaki-city/ || echo 000)
          echo "予約サイトの応答: $code"
          if [ "$code" = "403" ]; then
            echo "::error::予約サイトがGitHubからのアクセスを拒否しています(403)。ログインせずに中止しました。"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: 実行
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python lottery_check.py
