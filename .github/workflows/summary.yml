name: 合気道 抽選結果まとめ

on:
  # 2026-11 から自宅のWindowsパソコンで動かす。電源が切れているときは、次に電源を入れたときに動く(24時間以内)
  schedule:
    - cron: "17 22 17 * *"   # UTC17日22:17 = 日本時間18日7:17(18日0時台の抽選結果の公開後)
  workflow_dispatch:
    inputs:
      month:
        description: 集計する月(例 2026-12)。空欄なら2か月先を自動で選ぶ
        default: ""
      send_mail:
        description: 1=結果をメールでも送る 0=ログとCSVだけ
        default: "1"

permissions:
  contents: write

jobs:
  summary:
    runs-on: [self-hosted, Windows]   # 自宅のWindowsパソコンで動かす(予約サイトがGitHubからのアクセスを拒否するため 2026-11)
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\tools\ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/home-setup
      - name: 予約サイトに入れるか先に確認(入れなければ、ここで止める)
        run: |
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" -A "Mozilla/5.0" https://k7.p-kashikan.jp/chigasaki-city/ || echo 000)
          echo "予約サイトの応答: $code"
          if [ "$code" != "200" ]; then
            echo "::error::予約サイトに入れませんでした($code)。ログインせずに中止しました。"
            exit 1
          fi
      - name: 集計
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          SUMMARY_MONTH: ${{ github.event.inputs.month }}
          SEND_MAIL: ${{ github.event.inputs.send_mail || '1' }}
        run: python summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary
          path: summary/
      - name: 取込用ファイルを保存(管理画面の抽選取込タブが読み込む)
        if: always()
        run: |
          ls summary/*.json >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add summary/*.json
          git commit -m "抽選結果まとめ(取込用)を保存" || exit 0
          git pull --rebase && git push
