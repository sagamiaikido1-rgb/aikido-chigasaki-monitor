name: 合気道 抽選結果まとめ

on:
  schedule:
    - cron: "0 21 17 * *"   # UTC17日21:00 = 日本時間18日6:00
  workflow_dispatch:
    inputs:
      month:
        description: 集計する月(例 2026-12)。空欄なら2か月先を自動で選ぶ
        default: ""
      send_mail:
        description: 1=結果をメールでも送る 0=ログとCSVだけ
        default: "1"

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: 集計
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          SUMMARY_MONTH: ${{ github.event.inputs.month }}
          SEND_MAIL: ${{ github.event.inputs.send_mail }}
        run: python summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary
          path: summary/
