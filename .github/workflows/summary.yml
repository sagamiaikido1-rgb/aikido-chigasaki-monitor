name: 合気道 抽選結果まとめ

on:
  # 【一時停止中 2026-11-11】予約サイトがGitHubからのアクセスを403で拒否しているため自動実行を止めています。
  # 再開するときは下の # を外してください。
#  schedule:
#  - cron: "17 15 17 * *"   # UTC17日15:17 = 日本時間18日0:17
  workflow_dispatch:
    inputs:
      month:
        description: 集計する月(例 2026-12)。空欄なら2か月先を自動で選ぶ
        default: ""
      send_mail:
        description: 1=結果をメールでも送る 0=ログとCSVだけ
        default: "1"

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 予約サイトに入れるか先に確認(403なら、ここで止める)
        run: |
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" -A "Mozilla/5.0" https://k7.p-kashikan.jp/chigasaki-city/ || echo 000)
          echo "予約サイトの応答: $code"
          if [ "$code" = "403" ]; then
            echo "::error::予約サイトがGitHubからのアクセスを拒否しています(403)。ログインせずに中止しました。"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: 集計
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          SUMMARY_MONTH: ${{ github.event.inputs.month }}
          SEND_MAIL: ${{ github.event.inputs.send_mail || '1' }}
        run: python summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary
          path: summary/
      - name: 取込用ファイルを保存(管理画面の抽選取込タブが読み込む)
        if: always()
        run: |
          ls summary/*.json >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add summary/*.json
          git commit -m "抽選結果まとめ(取込用)を保存" || exit 0
          git pull --rebase && git push
