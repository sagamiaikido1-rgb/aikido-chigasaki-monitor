name: 合気道 予約サイトの表示診断(ログインしない)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: トップページを開いて表示内容を記録
        run: python site_diag.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-diag
          path: |
            site.png
            site.html
