name: 合気道 抽選期間中の件数チェック(修正案)

permissions:
  contents: write

on:
  # 2026-11 から自宅のWindowsパソコンで動かす。電源が切れているときは、次に電源を入れたときに動く(24時間以内)
  schedule:
    - cron: "41 11 1-15 * *"   # UTC11:41 = 日本時間20:41、毎月1〜15日(抽選分析の後)
    - cron: "41 1 15 * *"      # 15日だけ昼にも(UTC1:41 = 日本時間10:41)。締切前に判断の時間を残すため
  workflow_dispatch:
    inputs:
      month:
        description: 対象月(例 2027-01)。空欄なら2か月先
        default: ""
      new_ids:
        description: 新規ID(当選しやすいとされるID)の番号。例 3,7
        default: ""
      exclude_ids:
        description: 使わないIDの番号。例 5
        default: ""
      new_weight:
        description: 新規IDの重み
        default: "1.5"
      force:
        description: 1=申込期間外でも実行(テスト)
        default: "0"
      send_mail:
        description: 1=メールで送る 0=送らない(テスト)
        default: "1"

jobs:
  revise:
    runs-on: [self-hosted, Windows]   # 自宅のWindowsパソコンで動かす(予約サイトがGitHubからのアクセスを拒否するため 2026-11)
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\tools\ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/home-setup
      - name: 予約サイトに入れるか先に確認(入れなければ、ここで止める)
        run: |
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" -A "Mozilla/5.0" https://k7.p-kashikan.jp/chigasaki-city/ || echo 000)
          echo "予約サイトの応答: $code"
          if [ "$code" != "200" ]; then
            echo "::error::予約サイトに入れませんでした($code)。ログインせずに中止しました。"
            exit 1
          fi
      - name: 件数を読んで修正案をつくる(申込・取消はしない)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          PLAN_MONTH: ${{ github.event.inputs.month }}
          NEW_IDS: ${{ github.event.inputs.new_ids }}
          EXCLUDE_IDS: ${{ github.event.inputs.exclude_ids }}
          NEW_WEIGHT: ${{ github.event.inputs.new_weight || '1.5' }}
          FORCE: ${{ github.event.inputs.force || '0' }}
          SEND_MAIL: ${{ github.event.inputs.send_mail || '1' }}
        run: python revise.py
      - name: 修正案(ID番号と日付のみ)を保存
        if: success()
        run: |
          ls plan/revise_*.json >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add plan/revise_*.json
          git commit -m "抽選期間中の件数と修正案を保存" || exit 0
          git pull --rebase && git push
