name: 合気道 自宅パソコンの動作確認(ログインしない)

# 自宅のWindowsパソコン(GitHubに「self-hosted」として登録したもの)で動かす確認用。
# 予約サイトに1回だけアクセスし、Python・Git・Playwright が使えるかを確かめる。
on:
  workflow_dispatch:

jobs:
  home:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\tools\ms-playwright
    steps:
      - name: Git付属の bash と Python を使えるようにする(サービスの PATH に入らないため)
        shell: cmd
        run: |
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
          echo C:\Program Files\Python311>>"%GITHUB_PATH%"
          echo C:\Program Files\Python311\Scripts>>"%GITHUB_PATH%"
      - uses: actions/checkout@v4
      - name: 予約サイトの入口(1回だけ)
        run: |
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" -A "Mozilla/5.0" https://k7.p-kashikan.jp/chigasaki-city/ || echo 000)
          echo "HTTP: $code"
          [ "$code" = "200" ] || { echo "::error::自宅パソコンからも入れませんでした($code)"; exit 1; }
      - name: Python を用意する(パソコン本体には入れず、C:\actions-runner\tools の中だけに置く)
        run: |
          T=/c/actions-runner/tools
          mkdir -p "$T"
          if [ ! -x "$T/uv.exe" ]; then
            curl -sSL -o "$T/uv.zip" https://github.com/astral-sh/uv/releases/download/0.9.5/uv-x86_64-pc-windows-msvc.zip
            (cd "$T" && /c/Windows/System32/tar.exe -xf uv.zip && rm -f uv.zip)
          fi
          export UV_PYTHON_INSTALL_DIR="C:\actions-runner\tools\python"
          export UV_PYTHON_PREFERENCE=only-managed
          "$T/uv.exe" python install 3.11
          [ -x "$T/venv/Scripts/python.exe" ] || "$T/uv.exe" venv --seed --python 3.11 "C:\actions-runner\tools\venv"
          echo "C:\actions-runner\tools\venv\Scripts" >> "$GITHUB_PATH"
      - name: Python と Git の確認
        run: |
          python --version
          git --version
      - name: 必要な部品を入れる
        run: |
          python -m pip install -q -r requirements.txt tzdata
          python -m playwright install chromium
      - name: ブラウザで予約サイトのトップを開く(ログインしない)
        run: python site_diag.py
