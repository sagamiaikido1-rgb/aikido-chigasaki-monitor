name: 合気道 抽選申込案づくり

permissions:
  contents: write

on:
  # 2026-11 から自宅のWindowsパソコンで動かす。電源が切れているときは、次に電源を入れたときに動く(24時間以内)
  schedule:
    - cron: "41 22 17 * *"   # UTC17日22:41 = 日本時間18日7:41(抽選結果まとめの後)
  workflow_dispatch:
    inputs:
      month:
        description: 申込案を作る月(例 2027-01)。空欄なら次に申し込む月
        default: ""
      new_ids:
        description: 新規ID(当選しやすいとされるID)の番号。例 3,7
        default: ""
      exclude_ids:
        description: 使わないIDの番号。例 5
        default: ""
      new_weight:
        description: 新規IDの重み(1=ほかと同じ、1.5=1.5倍当たりやすいとみなす)
        default: "1.5"
      cap:
        description: 1IDあたりの申込上限。空欄なら候補日を含む週の数
        default: ""
      send_mail:
        description: 1=Excelをメールで送る 0=送らない(テスト)
        default: "1"

jobs:
  plan:
    runs-on: [self-hosted, Windows]   # 自宅のWindowsパソコンで動かす(予約サイトがGitHubからのアクセスを拒否するため 2026-11)
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\tools\ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/home-setup
      - name: 予約サイトに入れるか先に確認(入れなければ、ここで止める)
        run: |
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" -A "Mozilla/5.0" https://k7.p-kashikan.jp/chigasaki-city/ || echo 000)
          echo "予約サイトの応答: $code"
          if [ "$code" != "200" ]; then
            echo "::error::予約サイトに入れませんでした($code)。ログインせずに中止しました。"
            exit 1
          fi
      - name: 申込案をつくる
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          AIKIDO_ID_1: ${{ secrets.AIKIDO_ID_1 }}
          AIKIDO_PASS_1: ${{ secrets.AIKIDO_PASS_1 }}
          AIKIDO_ACCOUNTS: ${{ secrets.AIKIDO_ACCOUNTS }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          PLAN_MONTH: ${{ github.event.inputs.month }}
          NEW_IDS: ${{ github.event.inputs.new_ids }}
          EXCLUDE_IDS: ${{ github.event.inputs.exclude_ids }}
          NEW_WEIGHT: ${{ github.event.inputs.new_weight || '1.5' }}
          PLAN_CAP: ${{ github.event.inputs.cap }}
          SEND_MAIL: ${{ github.event.inputs.send_mail || '1' }}
        run: python plan.py
      - name: 申込案(ID番号と日付のみ)を保存
        if: success()
        run: |
          ls plan/*.json >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add plan/*.json
          git commit -m "抽選申込案を保存" || exit 0
          git pull --rebase && git push
